<style>
:root{--c:#0f2a44}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f8fb;color:#0f172a;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--c);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:clamp(1em,2.2vw,1.25em)}
header .sp{flex:1}
.pill{background:rgba(255,255,255,.15);border-radius:999px;padding:.2em .8em;font-size:.9em}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:clamp(10px,3vw,28px)}
.box{background:#fff;border-radius:16px;padding:clamp(14px,3vw,28px);width:min(760px,100%);box-shadow:0 4px 20px rgba(15,42,68,.08)}
.qt{font-size:clamp(1.1em,2.6vw,1.45em);font-weight:700;line-height:1.55;margin:.2em 0}
.tip{color:#64748b;font-size:.9em;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#f1f5f9;border:2px solid transparent;border-radius:12px;padding:.75em 1em;text-align:left;font:inherit;font-size:clamp(1em,2vw,1.12em);cursor:pointer;line-height:1.5;color:inherit}
.opt.ok{border-color:#16a34a;background:#dcfce7}.opt.bad{border-color:#dc2626;background:#fee2e2}
.exp{background:#f0f9ff;border-radius:10px;padding:10px 14px;margin-top:12px;line-height:1.65}
.btn{background:var(--c);color:#fff;border:0;border-radius:10px;padding:.7em 1.4em;font:inherit;font-size:1.05em;cursor:pointer;margin-top:12px}
.btn.gold{background:#fbbf24;color:var(--c);font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.seg button{border:1px solid var(--c);background:#fff;color:var(--c);border-radius:999px;padding:.4em 1em;font:inherit;cursor:pointer}
.seg button.on{background:var(--c);color:#fff}
.big{font-size:clamp(3em,10vw,4.5em);font-weight:900;text-align:center;color:var(--c);margin:.1em 0}
.muted{color:#64748b;line-height:1.6}
.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:4px 0 14px}.bar i{display:block;height:100%;background:#0ea5e9;transition:width .3s}
@media (orientation:landscape) and (max-height:500px){header{padding:6px 12px}main{padding:8px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{padding:.5em .8em}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<script>
const BANK=[{"id":"scen-realname","q":"小李人脸比对已通过，闸机却不开门，最可能的原因是？","tip":"人员实名制通道 · 未完成三级安全教育的新工人刷脸进场","opts":["闸机网络中断","特种作业证未上传","三级安全教育记录未完成","人脸库照片过期"],"ans":2,"explain":"实名制闸机不只认「人」，还核验准入条件。小李是钢筋工，不属特种作业，缺的是班组级教育记录，所以被按准入缺项拦下。","cat":"施工","point":"realname"},{"id":"scen-ai-attend","q":"无感考勤失败率升高时，最能说明「是设备问题而不是工人缺勤」的依据是？","tip":"AI 无感考勤 · 镜头积灰导致无感考勤大量漏识别","opts":["闸机通行数明显多于考勤记录数","当天考勤人数比昨天少","某班组长请假","夜间没有人通行"],"ans":0,"explain":"闸机已经放行了人，考勤却没记上，两套数据对不上，说明问题出在识别环节；考勤人数变少本身分不清是缺勤还是漏识别。","cat":"施工","point":"ai-attend"},{"id":"scen-video-ai","q":"AI 给出「未戴安全帽」置信度 78%，按本场景的设置应如何处理？","tip":"视频监控 · AI 识别 · 未戴安全帽的工人走向闸机","opts":["关闭该摄像头重新标定","推送人工复核后再确认","直接按违章罚款","当作误报忽略"],"ans":1,"explain":"78% 落在 70%～85% 的复核区间：直接处罚可能冤枉人，直接忽略又可能漏掉违章，所以交人工看抓拍确认。","cat":"施工","point":"video-ai"},{"id":"scen-crane1","q":"关于群塔防碰撞系统，下列说法正确的是？","tip":"1# 塔吊安全监控 · 1# 与 2# 塔吊回转靠近触发防碰撞","opts":["风速低于 6 级时可关闭防碰撞","两台塔吊力矩都低于 100% 就不会碰撞","防碰撞只能靠司机目视判断","需共享两台塔吊的回转角、幅度和高度实时计算距离"],"ans":3,"explain":"碰撞是空间位置问题，与力矩大小无关，也不取决于风速；系统必须用两塔的回转角、幅度、高度算出实时距离才能提前预警。","cat":"施工","point":"crane1"},{"id":"scen-crane2","q":"塔吊盲区吊装时，最关键的安全措施是？","tip":"2# 塔吊 · 吊钩可视化 · 吊物下方出现工人","opts":["司机鸣笛后自行判断","把吊重降到额定值一半","加快吊运速度缩短暴露时间","信号工全程指挥并设置吊装警戒区"],"ans":3,"explain":"盲区里司机看不到落点，吊钩可视化只是辅助；必须由信号工指挥，并用警戒区把人隔开，降速或减重都解决不了视线问题。","cat":"施工","point":"crane2"},{"id":"scen-hoist","q":"某升降机额定载重 2 t，下列哪种载重下超载保护必须中止吊笼启动？","tip":"升降机安全监控 · 施工升降机吊笼超载被禁止启动","opts":["1.6 t","2.0 t","2.3 t","1.9 t"],"ans":2,"explain":"按 JGJ 215 要求，载荷达到额定载重 110% 前应能中止启动，即 2.2 t 前；2.3 t 已超过，必须禁止启动，其余均在额定内。","cat":"施工","point":"hoist"},{"id":"scen-unload","q":"卸料平台总载重未超限，但左右钢丝绳拉力相差很大，说明什么？","tip":"卸料平台监测 · 卸料平台堆料超限现场蜂鸣","opts":["堆料偏载或一侧钢丝绳松弛","传感器一定损坏","平台还能多放材料","一切正常，可继续堆料"],"ans":0,"explain":"总载重合格不等于安全，拉力差大说明一侧受力过大，可能是偏载或另一侧钢丝绳松弛，须调整码放并检查钢丝绳。","cat":"施工","point":"unload"},{"id":"scen-pit-monitor","q":"关于基坑监测中的「预警值」和「控制值」，正确的是？","tip":"深基坑监测 · 基坑东侧测斜速率超限","opts":["预警值低于控制值，用于提前采取措施","两者是同一个数值","只看累计值，不看变化速率","控制值由施工班组自行设定"],"ans":0,"explain":"预警值是提前量，到了就要加密监测、查原因；控制值由设计确定，到了必须立即处置。速率和累计值都要监控。","cat":"施工","point":"pit-monitor"},{"id":"scen-patrol","q":"隐患整改单在什么情况下才能关闭？","tip":"移动巡更 · 巡更发现临边防护被拆","opts":["整改期限到期自动关闭","班组长回复「已整改」","班组上传整改照片后","安全员现场复查合格后"],"ans":3,"explain":"照片可能只拍局部，口头回复更无法核实；只有安全员到现场复查合格，整改才算真正完成，闭环不能省掉复查。","cat":"施工","point":"patrol"},{"id":"scen-person-loc","q":"人员定位系统设置「停留超过 10 s 才预警」，主要目的是？","tip":"人员定位 · 工人误入基坑底电子围栏","opts":["给工人留出干活时间","过滤定位漂移和路过边界造成的误报","满足规范规定的时长","节省安全帽电量"],"ans":1,"explain":"UWB 定位有一定漂移，人沿围栏边走也会短暂越界；加停留时长判断能大幅减少误报，误报少了告警才有人重视。","cat":"施工","point":"person-loc"},{"id":"scen-env","q":"扬尘系统用 10 分钟滑动平均判断超标，而不用单次读数，原因是？","tip":"环境监测 · 扬尘喷淋联动 · PM10 升高自动开启围挡喷淋","opts":["避免车辆经过造成的瞬时峰值误触发","可以减少喷淋次数节水","规范禁止使用实时数据","单次读数精度更高"],"ans":0,"explain":"车辆驶过时 PM10 会瞬间冲高又很快回落，用单次值会让喷淋频繁误启；滑动平均反映持续污染，判断更稳。","cat":"施工","point":"env"},{"id":"scen-vehicle","q":"判断车辆「未冲洗出场」时，比单看一张照片更可靠的做法是？","tip":"车辆管理 · 洗车 · 罐车未冲洗驶出大门","opts":["询问司机是否冲洗过","冲洗记录与出场抓拍联合判断","只核对车牌是否登记","根据当天天气判断"],"ans":1,"explain":"单张照片受光线和角度影响，可能误判；把洗车台冲洗记录和大门抓拍结合起来，两项证据一致，判定才可靠。","cat":"施工","point":"vehicle"},{"id":"scen-streetlight","q":"光照传感器失效时，智能路灯合理的兜底策略是？","tip":"智能路灯 · 傍晚光照传感器被泥浆糊住，路灯没亮","opts":["自动改按日落时间表控制","保持关闭等人工报修","改为全天常亮","降低亮度运行"],"ans":0,"explain":"全天常亮浪费电，保持关闭会留下夜间行车隐患；用日落时间表兜底，既保证按时照明，又能等电工修复传感器。","cat":"施工","point":"streetlight"},{"id":"scen-yijian","q":"某项目汇总分 82 分，但塔式起重机分项表为零分，安全检查等级应评为？","tip":"移动检查（质量安全巡检） · 按 JGJ 59 检查表打分出现零分分项","opts":["不合格","需重新打分后再定","合格","优良"],"ans":0,"explain":"JGJ 59 第5.0.2条规定，有一分项检查评分表为零分即不合格，即使汇总分达到 80 分以上也不能评优良或合格。","cat":"施工","point":"yijian"},{"id":"scen-jiguan","q":"一台挖机工时正常、位置也在作业区内，平台仍然告警，最可能的原因是？","tip":"机械设备管理 · 未验收的挖掘机连夜进场启动","opts":["天气不适合作业","工作时长太短","当天油耗偏高","设备未验收或操作手证件缺失"],"ans":3,"explain":"位置和工时正常只说明它在干活，机械管理首先看准入：未验收、证件缺失的设备即使正常运转也属违规作业。","cat":"施工","point":"jiguan"},{"id":"scen-rebar-ai","q":"用 AI 数钢筋时，哪种情况最需要人工复核？","tip":"钢筋 AI 盘点管理 · 钢筋进场实收根数与送货单不符","opts":["端面平整清晰的部位","端面重叠、锈蚀或模糊的部位","整捆规格统一时","光线充足的白天"],"ans":1,"explain":"AI 对清晰圆形端面计数很准，重叠、锈蚀、模糊处置信度低，容易多数或漏数，这些部位必须人工复核。","cat":"施工","point":"rebar-ai"},{"id":"scen-smoke","q":"按 GB/T 50720，可燃材料堆场及其加工场与在建工程的防火间距不应小于？","tip":"烟感报警 · 木工棚插排过热冒烟","opts":["4 m","10 m","6 m","15 m"],"ans":1,"explain":"第3.2.1A条：易燃易爆危险品库房不小于 15 m，可燃材料堆场及加工场、固定动火作业场不小于 10 m，其他临时设施不小于 6 m。","cat":"施工","point":"smoke"},{"id":"scen-prefab-lift","q":"叠合梁吊装前扫码核对，核心目的是？","tip":"叠合梁吊装 · 扫码发现吊错了叠合梁","opts":["统计吊装工人工时","测量构件实际重量","确认构件与图纸位置、吊装顺序一致","检查塔吊是否年检"],"ans":2,"explain":"外形相近的构件配筋可能完全不同，装错位置会造成结构隐患；扫码把实物、图纸和吊装序列对上，才能防错吊漏吊。","cat":"施工","point":"prefab-lift"},{"id":"scen-slab-lift","q":"叠合板分层堆放时，层间垫木应如何放置？","tip":"叠合板 / 预制剪力墙吊装 · 叠合板超层堆放、墙板未插销","opts":["垫木越多越安全","只在最底层放垫木","每层随意错开摆放","上下对齐在同一竖直线上"],"ans":3,"explain":"垫木上下对齐，荷载才能竖直传到地面；错位会让叠合板受弯开裂，只垫底层则上层板直接受压。","cat":"施工","point":"slab-lift"},{"id":"scen-stair-lift","q":"判断预制楼梯卸车点是否可行，根本依据是？","tip":"装配式楼梯吊装 · 构件运输与堆放 · 楼梯运输车停在塔吊覆盖范围外","opts":["构件的生产批次","司机的停车习惯","离场内道路的远近","塔吊幅度及该幅度下的额定起重量"],"ans":3,"explain":"塔吊幅度越大起重量越小，卸车点既要在覆盖范围内，又要满足该幅度下的起重量，否则只能斜拉或超载，都是违规。","cat":"施工","point":"stair-lift"},{"id":"scen-grout","q":"现场判断套筒灌浆合格，最直接的依据是？","tip":"套筒灌浆 · 构件临时支撑 · 低温夜间灌浆，两个出浆口没出浆","opts":["斜撑已经安装牢固","本批灌浆料全部用完","所有出浆口均出浆，灌浆饱满密实","灌浆持续时间足够长"],"ans":2,"explain":"GB/T 51231 第11.3.3条要求灌浆饱满、密实，所有出口均应出浆并全数检查；时间长短和用料多少都不能证明套筒已灌满。","cat":"施工","point":"grout"},{"id":"scen-safety-exp","q":"安全体验记录接入实名制系统，主要作用是？","tip":"安全体验区 · 新工人未完成安全体验就被派上楼","opts":["统计工人休息时长","把培训完成情况作为施工区准入条件","作为工资计算依据","替代三级安全教育"],"ans":1,"explain":"体验是三级教育中的一个环节，不能替代教育本身；接入实名制后，没完成就进不了施工区，培训要求才真正落地。","cat":"施工","point":"safety-exp"},{"id":"scen-vr","q":"与课堂讲解相比，VR 安全教育最大的优势是？","tip":"VR 安全教育 · VR 考核不合格的架子工申请登高","opts":["只适合管理人员使用","培训后不需要考核","可以完全替代实操培训","沉浸体验事故后果并留下可分析的考核数据"],"ans":3,"explain":"VR 能让人「亲历」事故后果，答题数据还能找出个人薄弱点；但安全带穿戴等动作仍需实操，不能完全替代。","cat":"施工","point":"vr"},{"id":"scen-quality","q":"「样板引路」的正确顺序是？","tip":"质量样板区 · 未经样板引路就大面积砌墙","opts":["样板施工—验收—交底—大面积施工","图纸交底—直接大面积施工","监理施工样板—班组观摩","大面积施工—补做样板—验收"],"ans":0,"explain":"先做样板并验收，用实物统一标准，再对班组交底，最后大面积施工；事后补样板起不到引路作用，样板也应由施工班组完成。","cat":"施工","point":"quality"},{"id":"scen-sewage","q":"养护室温湿度要连续记录并存档，主要原因是？","tip":"三级污水沉淀池 · 水泵房 · 养护室 · 寒潮夜里养护室温度偏低","opts":["替代试块强度检测","方便工人进出休息","证明试块养护条件有效，强度结果可信","为了计算养护室电费"],"ans":2,"explain":"试块强度是判断结构混凝土是否合格的依据，只有证明全程在标准养护条件下，试验结果才可信；记录不能替代检测。","cat":"施工","point":"sewage"},{"id":"scen-danger","q":"危险品库门磁显示开启，却没有任何授权刷卡记录，正确的处理是？","tip":"危险品仓库 · 危险品库门被撬开未关","opts":["门开着有利通风，保持即可","判定异常开启，联动视频核实并派人到场","烟感没报警就不用处理","等下班后统一检查"],"ans":1,"explain":"无授权开门本身就是异常，危险品库不能等出现烟雾才处置；视频核实是谁、拿走了什么，再派人到场关门和追回物品。","cat":"施工","point":"danger"},{"id":"scen-water-elec","q":"漏电流已达 36 mA，但漏电保护器没有跳闸，电工应该怎么做？","tip":"智能水电监测 · 地下室配电箱漏电电流升高","opts":["把报警阈值调高","先把箱门关上","上级断电挂牌后检查漏保和线路","继续观察一段时间"],"ans":2,"explain":"漏电流超限而漏保不动作，说明保护失效，人一碰就有触电危险；必须先在上级断电挂牌，再查线路和漏保。","cat":"施工","point":"water-elec"},{"id":"scen-cover","q":"把 AI 覆盖率识别和周边 PM10 读数一起使用，意义是？","tip":"裸土与堆料绿网覆盖 · 大风掀开绿网，裸土外露","opts":["可以代替围挡喷淋","两者没有关系，各看各的","既定位问题位置，又验证对扬尘的实际影响","只是为了拍照留档"],"ans":2,"explain":"覆盖率告诉我们哪里没盖好，PM10 告诉我们它是否真在起尘；两者结合能分清轻重缓急，整改后也能验证效果。","cat":"施工","point":"cover"},{"id":"scen-cloud","q":"多个子系统同时告警时，平台应优先处理哪一类？","tip":"智慧工地云平台 · 大风来袭，多个子系统同时告警","opts":["可能危及人身和结构安全的告警","最早出现的那条告警","告警条数最多的子系统","环境类告警"],"ans":0,"explain":"告警排序看后果严重程度，不看数量和先后；塔吊大风、围挡倾倒可能伤人，必须先处理，扬尘超标可稍后。","cat":"施工","point":"cloud"},{"id":"scen-qrcode","q":"与纸质台账相比，二维码管理的关键优势是？","tip":"二维码应用 · 扫塔吊二维码发现维保逾期","opts":["现场扫码即见实时状态并留下检查痕迹","贴码设备可以免于维保","扫码可以代替进场验收","二维码贴上后永远不会丢"],"ans":0,"explain":"二维码的价值在于连着平台实时数据，现场一扫就知道是否逾期，检查行为本身也被记录；它不能代替维保和验收。","cat":"施工","point":"qrcode"},{"id":"scen-board","q":"宣传栏主题更新，最好的依据是？","tip":"宣传栏 · 安全操作动漫标语 · 宣传栏主题滞后于施工阶段","opts":["固定一年不变，便于记忆","当前施工阶段的风险和违章统计","版面美观程度","上级检查的时间安排"],"ans":1,"explain":"工人最需要知道的是眼下这个阶段会出什么事；按施工阶段和违章数据选主题，宣传才和现场风险对得上。","cat":"施工","point":"board"},{"id":"scen-helmet","q":"安全帽撞击体验中，为什么反复强调系紧下颏带？","tip":"安全帽撞击体验 · 撞击体验发现一批安全帽不合格","opts":["增加帽子重量提高缓冲","防止受冲击或坠落时帽子脱落失去保护","让安全帽戴得更美观","下颏带颜色区分工种"],"ans":1,"explain":"帽子再合格，掉了就没有保护作用；人被撞或摔倒时，没系下颏带的安全帽很容易先飞出去。","cat":"施工","point":"helmet"},{"id":"scen-hole-fall","q":"施工中洞口盖板挡住了材料运输，正确做法是？","tip":"洞口坠落体验 · 洞口坠落体验中迟迟没发现盖板被挪开","opts":["自己挪开，用完再盖回","用彩条布盖住洞口","报告管理人员，采取替代防护后再处理","临时放一块薄木板"],"ans":2,"explain":"洞口防护严禁随意拆除；自行挪开最容易「忘了盖回」，彩条布和薄木板都承受不了人的重量，形同虚设。","cat":"施工","point":"hole-fall"},{"id":"scen-prefab-show","q":"PCF 板在装配式建筑中的主要作用是？","tip":"预制构件展示 · 新技术员认构件考核不合格","opts":["作为预制楼梯梯段","作为主要承重墙体","作现浇部位的外侧模板，兼作外饰面","作为叠合楼板的底板"],"ans":2,"explain":"PCF 板即预制混凝土外墙模板，浇筑时作外侧模板、建成后作外饰面，本身不承重，常用于转角等现浇部位。","cat":"施工","point":"prefab-show"},{"id":"scen-weigh","q":"智能地磅加装红外对射装置，作用是？","tip":"物料仓库 · 磅房 · 砂石车未完全上磅，净重偏少","opts":["测量车辆速度","判断车辆是否完全上磅，防止作弊和误差","识别车牌号码","测量车辆温度"],"ans":1,"explain":"车轮压在磅外会让读数偏小，也是常见作弊手法；红外对射被挡说明车身没完全上磅，系统就拒绝出单。","cat":"施工","point":"weigh"},{"id":"scen-energy","q":"发现夜间能耗异常时，最先应查看哪类数据来定位原因？","tip":"能耗分项计量 · 7 层夜间用电是同层基线的 3 倍","opts":["全楼总用电量","当天室外温度","上月电费账单","分项计量和楼层计量数据"],"ans":3,"explain":"总电量只能说明「多用了」，分项和楼层数据才能指出是哪一层、哪个系统多用，维修员才能直接找到问题设备。","cat":"运维","point":"energy"},{"id":"scen-hvac","q":"判断冷却塔「补水异常」，最合理的依据是？","tip":"暖通空调监控 · 冷却塔补水阀频繁动作","opts":["机组功率偏低","当天室外温度很高","补水量明显高于同负荷下的历史基线","补水阀动作了一次"],"ans":2,"explain":"冷却塔本来就要不断补水，天热蒸发也多；只有在负荷相近时补水量明显超出基线，才说明有渗漏或溢流。","cat":"运维","point":"hvac"},{"id":"scen-elevator","q":"电梯困人时，被困人员最应该怎么做？","tip":"电梯监测 · 晚高峰电梯困人","opts":["按警铃联系外部，保持冷静等待救援","在轿厢内跳动让电梯下行","撬开顶部安全窗爬出","用力扒门自救"],"ans":0,"explain":"电梯停在两层之间时扒门或爬出极易坠入井道；系统已经报警通知维保，被困者只需保持联系、等待专业救援。","cat":"运维","point":"elevator"},{"id":"scen-water","q":"「夜间最小流量法」查漏的原理是？","tip":"给排水与水箱 · 凌晨流量持续不归零","opts":["白天的水表读数不准","夜间水温低，便于测量","夜间管网水压最高","夜间正常用水接近零，持续流量多为漏损"],"ans":3,"explain":"凌晨几乎没人用水，流量本应接近零；如果一直不归零，多出来的部分基本就是漏损，再用分区水表缩小范围。","cat":"运维","point":"water"},{"id":"scen-fire","q":"根据 GB 25201-2010，建筑消防设施应至少多久检测一次？","tip":"消防设施监控 · 3 层装修罩住烟感导致离线","opts":["每季度","每月","每年","每三年"],"ans":2,"explain":"GB 25201-2010 第7.1.1条规定建筑消防设施每年至少检测一次，重点单位还要在年底前把检测记录报消防机构备案。","cat":"运维","point":"fire"},{"id":"scen-access","q":"门禁系统把「连续失败」而不是「单次失败」作为告警条件，原因是？","tip":"安防门禁 · 后门连续刷卡失败联动抓拍","opts":["单次失败多因光线或表情，连续失败更可能是异常","规范规定必须连续 5 次","单次失败系统不做记录","为了节省网络带宽"],"ans":0,"explain":"正常员工偶尔会因逆光、戴口罩识别失败一次；短时间内反复失败才更像冒用或闯入，这样设置可兼顾安全与误报。","cat":"运维","point":"access"},{"id":"scen-ienv","q":"BA 已经加大新风，CO₂ 却仍不下降，最可能说明什么？","tip":"室内环境监测 · 会议室 CO₂ 超标，加大新风也降不下来","opts":["CO₂ 传感器一定坏了","会议室人数太少","需要调高空调温度","新风系统本身有故障，如滤网堵塞"],"ans":3,"explain":"联动指令发出却没有效果，说明执行端出了问题；风机压差偏高指向滤网堵塞，传感器漂移也要查，但不是「一定坏了」。","cat":"运维","point":"ienv"},{"id":"scen-parking","q":"车位检测器离线时，平台可用什么方法校核剩余车位？","tip":"停车管理 · 早高峰剩余车位不足且检测器离线","opts":["按昨天同时段数据估算","用出入口车牌进出数量差计算","直接显示车位已满","沿用离线前的最后读数"],"ans":1,"explain":"车位总数减去在场车辆数就是剩余车位，在场数可由出入口车牌进出差值得到，不依赖单个检测器，适合兜底校核。","cat":"运维","point":"parking"},{"id":"scen-workorder","q":"一张设备工单真正「闭环」的标志是？","tip":"物业中心 · 设备工单 · 漏水工单超时未响应自动升级","opts":["平台上的告警消失","派单成功","维修员到达现场","处理完成并经回访确认后关闭"],"ans":3,"explain":"派单和到场只是过程，告警消失也可能是暂时的；只有处理完成、结果经回访确认后关闭，才算闭环并进入维保档案。","cat":"运维","point":"workorder"},{"id":"scen-pv","q":"判断某个光伏组串「效率偏低」，最合理的比较对象是？","tip":"屋顶光伏发电 · 屋面光伏组串效率偏低","opts":["去年同一天的发电量","同一时刻、同一屋面其他组串的效率","组件铭牌上的额定功率","全楼用电量"],"ans":1,"explain":"同一时刻、同一屋面的组串晒的是同样的太阳，只有它掉得多，才能排除天气因素，锁定这一组串自身的问题。","cat":"运维","point":"pv"},{"id":"scen-ev","q":"有序充电的主要目的是？","tip":"光伏车棚 · 充电桩 · 下班高峰集中充电，变压器负载逼近上限","opts":["让每辆车都充得更快","把充电负荷错开到光伏多或用电低谷的时段，避免配电超载","减少充电桩数量","提高电价收入"],"ans":1,"explain":"有序充电按光伏出力和楼内负荷调度充电功率，削峰填谷，既保护变压器，又多用清洁电和低谷电。","cat":"运维","point":"ev"},{"id":"scen-green-roof","q":"绿色屋顶对建筑运行的好处，下列哪项说法不对？","tip":"绿色屋顶 · 连续晴天，种植屋面土壤过干","opts":["降低顶层夏季空调负荷","滞留部分雨水，减轻排水压力","缓解城市热岛","可以取消屋面防水层"],"ans":3,"explain":"种植屋面反而对防水要求更高，必须设耐根穿刺防水层，植物根系和长期潮湿都会威胁防水。","cat":"运维","point":"green-roof"},{"id":"scen-sponge","q":"海绵设施「渗、滞、蓄、净、用、排」中，雨水花园主要承担哪几项？","tip":"海绵设施 · 雨水花园与透水铺装 · 暴雨后雨水花园迟迟不排空","opts":["只负责「排」","渗、滞、净","只负责「用」","把雨水送进自来水厂"],"ans":1,"explain":"雨水花园是下凹绿地，让雨水先滞留、慢慢下渗，并靠植物和土壤净化初期雨水，超过设计深度才从溢流口排走。","cat":"运维","point":"sponge"},{"id":"scen-rainwater","q":"关于雨水回用，下列做法正确的是？","tip":"雨水回收 · 节水灌溉 · 雨水池液位降到下限","opts":["回用雨水可以直接接入生活饮用水管","回用水管道应与生活饮用水管道严格分开，并有明显标识","雨水池可以一直抽到见底","初期雨水最干净，应优先收集"],"ans":1,"explain":"回用雨水只能用于浇灌、冲洗等非饮用用途，管道必须与饮用水系统分开并标识；初期雨水最脏，要先弃流。","cat":"运维","point":"rainwater"},{"id":"scen-gshp","q":"地源热泵长期运行最需要关注的问题是？","tip":"地源热泵能源站 · 夏季午后地源热泵能效下降","opts":["埋管颜色","全年从地下取热和排热是否平衡","草坪是否修剪","机房照明"],"ans":1,"explain":"如果夏季排进地下的热远多于冬季取出的热，地温会逐年升高，机组效率越来越低，所以要监测地温、保持冷热平衡。","cat":"运维","point":"gshp"},{"id":"scen-waste","q":"桶满溢传感器给垃圾分类管理带来的最大变化是？","tip":"垃圾分类 · 资源化 · 午饭后厨余垃圾桶满溢","opts":["垃圾自动分类","由「定时清运」变成「按需清运」","不再需要保洁员","垃圾总量变少"],"ans":1,"explain":"传感器让管理者知道哪个桶快满了，按需派单，既避免满溢，也减少空车清运。","cat":"运维","point":"waste"},{"id":"scen-carbon","q":"建筑运行碳排放的基本算法是？","tip":"碳排放监测与公示 · 8 月运行碳排放超过目标","opts":["建筑面积 × 层数","各类用能量 × 对应排放因子，再扣除可再生能源减碳量","电费 ÷ 电价","只算燃气"],"ans":1,"explain":"运行碳排放由电、燃气等各类能源用量乘以各自排放因子得到，屋面光伏等可再生能源发电可以抵扣。","cat":"运维","point":"carbon"},{"id":"x-1","q":"现浇框架结构一个标准层的常规施工顺序是？","tip":"主体结构","opts":["柱 → 梁板 → 楼梯 → 填充墙","填充墙 → 柱 → 梁板 → 楼梯","梁板 → 柱 → 楼梯 → 填充墙","楼梯 → 柱 → 填充墙 → 梁板"],"ans":0,"explain":"竖向构件柱先施工，梁板支撑在柱上；楼梯随后施工；填充墙是非承重的二次结构，最后砌筑。","cat":"施工"},{"id":"x-2","q":"装配式框架中，预制柱就位后、摘钩之前必须完成的是？","tip":"装配式","opts":["浇筑叠合层","安装临时斜支撑并校正垂直度","安装外墙板","拆除独立支撑"],"ans":1,"explain":"预制柱自身不稳定，必须先用斜支撑临时固定、校正垂直度后才能摘钩。","cat":"施工"},{"id":"x-3","q":"预制柱与下层伸出的竖向钢筋，常用哪种方式连接？","tip":"装配式","opts":["焊接","绑扎搭接","钢筋套筒灌浆连接","螺栓连接"],"ans":2,"explain":"装配式混凝土结构的竖向钢筋常用套筒灌浆连接（JGJ 355）。","cat":"施工"},{"id":"x-4","q":"套筒灌浆时，灌浆料应从哪里注入？","tip":"装配式","opts":["从上部出浆孔注入","从下部灌浆孔注入，上部出浆孔出浆后封堵","从柱顶倒入","任意一个孔都可以"],"ans":1,"explain":"从下往上压浆，空气才能排出；所有出浆口连续出浆才说明灌满。","cat":"施工"},{"id":"x-5","q":"叠合板上还要再浇一层混凝土，主要目的是？","tip":"装配式","opts":["增加美观","与预制底板、叠合梁连成整体，共同受力","代替防水层","方便拆模"],"ans":1,"explain":"叠合层把预制构件连成整体，形成楼盖的整体性。","cat":"施工"},{"id":"x-6","q":"框架结构中的填充墙属于？","tip":"主体结构","opts":["主要承重结构","二次结构，非承重","基础","临时设施"],"ans":1,"explain":"框架结构由梁柱承重，填充墙只起围护和分隔作用，属于二次结构。","cat":"施工"},{"id":"x-7","q":"隐蔽工程验收应在什么时候进行？","tip":"质量","opts":["混凝土浇筑完成后","被下一道工序覆盖之前","竣工验收时","拆模之后"],"ans":1,"explain":"钢筋、预埋件等一旦浇筑就看不见了，必须在覆盖前验收合格并签字。","cat":"施工"},{"id":"x-8","q":"按 JGJ 202-2010，附着式升降脚手架的架体高度不得大于几倍楼层高？","tip":"规范","opts":["3 倍","4 倍","5 倍","6 倍"],"ans":2,"explain":"JGJ 202-2010 第 4.4.2 条：架体高度不得大于 5 倍楼层高。","cat":"施工"},{"id":"x-9","q":"按 JGJ 215-2010，施工升降机防坠安全器应在多长的有效标定期内使用？","tip":"规范","opts":["半年","一年","两年","三年"],"ans":1,"explain":"JGJ 215-2010 第 4.1.7 条：防坠安全器应在一年有效标定期内使用。","cat":"施工"},{"id":"x-10","q":"按 GB 50300-2013，建筑工程施工质量验收划分为？","tip":"规范","opts":["单位工程、分部工程、分项工程、检验批","基础、主体、装修","土建、安装、装饰","设计、施工、监理"],"ans":0,"explain":"GB 50300-2013 第 4.0.1 条。","cat":"施工"},{"id":"x-11","q":"《民用建筑能耗标准》GB/T 51161 中的「约束值」是指？","tip":"运维","opts":["建议达到的先进值","为实现建筑使用功能所允许消耗的能耗上限","设计计算值","历史平均值"],"ans":1,"explain":"约束值是能耗上限，另有更严格的「引导值」。","cat":"运维"},{"id":"x-12","q":"外挂墙板在实际施工中通常什么时候安装？","tip":"装配式","opts":["基础施工前","与柱同时吊装","比主体结构滞后若干层","竣工验收后"],"ans":2,"explain":"外挂墙板一般滞后主体结构 2–3 层安装，避免与上部结构吊装交叉。","cat":"施工"},{"id":"x-13","q":"按 GB 55015-2021 第 5.2.1 条，新建建筑应安装哪类系统？","tip":"运维","opts":["太阳能系统","地源热泵系统","雨水回收系统","中水系统"],"ans":0,"explain":"GB 55015-2021 第 5.2.1 条：新建建筑应安装太阳能系统。","cat":"运维"},{"id":"x-14","q":"GB/T 50378-2019（2024 年版）绿色建筑评价的 5 类指标不包括？","tip":"运维","opts":["安全耐久","健康舒适","施工进度","资源节约"],"ans":2,"explain":"5 类指标是安全耐久、健康舒适、生活便利、资源节约、环境宜居，另设提高与创新加分项。","cat":"运维"},{"id":"x-15","q":"按 GB/T 50378-2019（2024 年版），绿色建筑总得分达到多少分（且满足其他要求）可评为二星级？","tip":"运维","opts":["50 分","60 分","70 分","85 分"],"ans":2,"explain":"一星级、二星级、三星级分别对应总得分 60、70、85 分，并要满足全部控制项、每类评分项不低于 30% 等要求。","cat":"运维"},{"id":"x-16","q":"按 GB/T 51366-2019，设计文件未给出设计寿命时，建筑碳排放计算按多少年计？","tip":"运维","opts":["25 年","30 年","50 年","70 年"],"ans":2,"explain":"GB/T 51366-2019 第 4.1.2 条：设计文件不能提供时，应按 50 年计算。","cat":"运维"},{"id":"x-17","q":"下列哪项属于「隐含碳」？","tip":"运维","opts":["空调全年用电","电梯运行用电","钢筋和水泥的生产排放","办公照明用电"],"ans":2,"explain":"建材生产、运输和建造的排放在竣工前就已发生，称为隐含碳；空调、照明、电梯用电属于运行碳。","cat":"运维"},{"id":"x-18","q":"雨水收集时要设「初期雨水弃流」，原因是？","tip":"运维","opts":["初期雨水水量最大","初期雨水冲刷屋面和地面，污染物最多","初期雨水温度高","为了节省水池容积以外没有原因"],"ans":1,"explain":"降雨开始时雨水把屋面、地面的灰尘和污染物冲下来，最脏，先弃掉再收集，回用水质更好。","cat":"运维"},{"id":"x-19","q":"按 JGJ 147-2016，机械拆除建筑时正确的顺序是？","tip":"施工","opts":["从下至上，先拆承重结构","从上至下逐层分段，先拆非承重结构再拆承重结构","先拆中间楼层","整体推倒后再分拣"],"ans":1,"explain":"JGJ 147-2016 第 5.2.2 条：应从上至下逐层拆除，并应分段进行；应先拆除非承重结构，再拆除承重结构。","cat":"施工"},{"id":"x-20","q":"拆除工程施工时，下列做法错误的是？","tip":"施工","opts":["先切断水、电、气源","围挡封闭、湿法作业","现场焚烧废木料减少外运","拆除物料分类回收"],"ans":2,"explain":"JGJ 147-2016 第 7.0.5 条：施工现场严禁焚烧各类废弃物。","cat":"施工"},{"id":"x-21","q":"GB/T 50640-2023《建筑与市政工程绿色施工评价标准》的适用范围包括？","tip":"施工","opts":["只适用于新建建筑","新建、扩建、改建及拆除等建筑工程和市政工程","只适用于市政道路","只适用于装配式建筑"],"ans":1,"explain":"该标准第 1.0.2 条：适用于新建、扩建、改建及拆除等建筑工程与道路、桥梁和隧道等市政工程绿色施工评价。","cat":"施工"},{"id":"x-22","q":"绿色策划阶段把临建放在规划道路和后期绿地位置，主要是为了？","tip":"施工","opts":["让临建更漂亮","避免主体施工时二次搬迁，减少建筑垃圾","离城市道路更近","方便塔吊吊装"],"ans":1,"explain":"临建占用后续要施工的位置就要拆迁重建，浪费材料、产生垃圾。","cat":"施工"}];
const qs0=new URLSearchParams(location.search);
let N=[3,4,5].includes(+qs0.get('n'))?+qs0.get('n'):5, scope=['施工','运维'].includes(qs0.get('scope'))?qs0.get('scope'):'全部';
const box=document.getElementById('box'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function post(type,value,extra){try{window.parent.postMessage(Object.assign({type,value},extra||{}),'*')}catch(e){}}
function home(){
  const cnt=s=>BANK.filter(q=>s==='全部'||q.cat===s).length;
  box.innerHTML='<div class="qt">智慧工地与建筑智能运维 · 退场小测</div><p class="muted">从 '+BANK.length+' 道题中随机抽题，每题 '+Math.round(100/N)+' 分，满分 100。答题时分数和完成状态会自动同步给双人对战平台。</p>'+
  '<div class="seg" id="s">'+['全部','施工','运维'].map(s=>'<button class="'+(s===scope?'on':'')+'" data-s="'+s+'">'+s+'（'+cnt(s)+'）</button>').join('')+'</div>'+
  '<div class="seg" id="n">'+[3,4,5].map(n=>'<button class="'+(n===N?'on':'')+'" data-n="'+n+'">'+n+' 题</button>').join('')+'</div><button class="btn gold" id="go">开始答题</button><p class="muted" style="font-size:.85em;margin-top:14px">安徽工业大学 · 建筑工程学院 · 工程沙盘虚拟仿真系统</p>';
  box.querySelectorAll('#s button').forEach(b=>b.onclick=()=>{scope=b.dataset.s;home()});
  box.querySelectorAll('#n button').forEach(b=>b.onclick=()=>{N=+b.dataset.n;home()});
  box.querySelector('#go').onclick=start;
}
function start(){
  const qs=shuffle(BANK.filter(q=>scope==='全部'||q.cat===scope)).slice(0,N).map(q=>{const o=shuffle(q.opts.map((_,i)=>i));return Object.assign({},q,{opts:o.map(i=>q.opts[i]),ans:o.indexOf(q.ans)})});
  const per=Math.round(100/qs.length);let i=0,score=0,right=0;
  const hud=()=>{document.getElementById('hp').textContent='得分 '+score;document.getElementById('hq').textContent=i<qs.length?('第 '+(i+1)+'/'+qs.length+' 题'):'完成'};
  post('score',0);post('progress',0,{current:0,total:qs.length});
  const draw=()=>{const q=qs[i];hud();
    box.innerHTML='<div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div><div class="qt">'+esc(q.q)+'</div><div class="tip">'+esc(q.tip)+'</div><div class="opts">'+q.opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>').join('')+'</div><div id="e"></div>';
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(box.querySelector('.opt.ok'))return;const k=+b.dataset.k,ok=k===q.ans;
      box.querySelectorAll('.opt')[q.ans].classList.add('ok');if(!ok)b.classList.add('bad');if(ok){score=Math.min(100,score+per);right++}
      if(right===qs.length)score=100;hud();post('score',score);post('progress',i+1,{current:i+1,total:qs.length});
      box.querySelector('#e').innerHTML='<div class="exp"><b>'+(ok?'✓ 答对了':'✗ 答错了')+'</b>　'+esc(q.explain||'')+'</div><button class="btn" id="nx">'+(i+1<qs.length?'下一题 ›':'看成绩')+'</button>';
      box.querySelector('#nx').onclick=()=>{i++;i<qs.length?draw():end()}})};
  const end=()=>{hud();post('done',score);box.innerHTML='<p class="muted" style="text-align:center;margin:0">答题完成</p><div class="big">'+score+'</div><p style="text-align:center">答对 '+right+' / '+qs.length+' 题</p><div style="text-align:center"><button class="btn gold" id="ag">再来一局</button></div>';box.querySelector('#ag').onclick=start};
  draw();
}
qs0.get('auto')?start():home();
</script></body></html>
